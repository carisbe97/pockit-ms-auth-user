server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: pockit-ms-auth-user
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:ares}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:pockit-ms-auth-user/.env[.properties]
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PockitAuthHikariPool
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:30000}
      keepalive-time: 0
      data-source-properties:
        preferQueryMode: simple
        prepareThreshold: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    url: ${FLYWAY_DB_URL:${DB_URL}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    string-output-type: base64
    key-obtention-iterations: 1000
    pool-size: 1

app:
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:http://localhost:8081}
    server-description: ${APP_OPENAPI_SERVER_DESC:Ares - Desarrollo Local (DEV)}
  crypto:
    replay-window-seconds: ${APP_CRYPTO_REPLAY_WINDOW_SECONDS:300}
    rsa:
      private-key: ${APP_CRYPTO_RSA_PRIVATE_KEY:}
      public-key: ${APP_CRYPTO_RSA_PUBLIC_KEY:}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:pockit-ms-auth-user}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
    csp-policy: ${APP_SECURITY_CSP_POLICY:default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage:
      avatar-bucket: ${SUPABASE_AVATAR_BUCKET:avatars}

---
spring:
  config:
    activate:
      on-profile: ares
  jpa:
    show-sql: true
server:
  ssl:
    enabled: false
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:pockit-ares-dev-jasypt-master-key}
app:
  security:
    jwt:
      secret: ${JWT_SECRET:pockit-ares-dev-jwt-secret-key-minimo-64-bytes-hs512-solo-desarrollo-local-0123456789}
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.pockit.finance: DEBUG

---
spring:
  config:
    activate:
      on-profile: hermes
  jpa:
    show-sql: false
server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    protocol: TLS
    enabled-protocols: TLSv1.3,TLSv1.2
    client-auth: need
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:pockit-ms-auth-user}
    trust-store: ${SSL_TRUSTSTORE_PATH}
    trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
    trust-store-type: ${SSL_TRUSTSTORE_TYPE:PKCS12}
management:
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    com.pockit.finance: INFO

---
spring:
  config:
    activate:
      on-profile: zeus
  jpa:
    show-sql: false
server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    protocol: TLS
    enabled-protocols: TLSv1.3,TLSv1.2
    client-auth: need
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:pockit-ms-auth-user}
    trust-store: ${SSL_TRUSTSTORE_PATH}
    trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
    trust-store-type: ${SSL_TRUSTSTORE_TYPE:PKCS12}
app:
  security:
    csp-policy: "default-src 'self'; frame-ancestors 'none'"
management:
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    com.pockit.finance: WARN
