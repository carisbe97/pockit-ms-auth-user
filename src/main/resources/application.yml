server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: pockit-ms-auth-user
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:ares}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:pockit-ms-auth-user/.env[.properties]
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PockitAuthHikariPool
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:30000}
      keepalive-time: 0
      data-source-properties:
        preferQueryMode: simple
        prepareThreshold: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    url: ${FLYWAY_DB_URL:${DB_URL}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:http://localhost:8081}
    server-description: ${APP_OPENAPI_SERVER_DESC:Ares - Desarrollo Local (DEV)}

---
spring:
  config:
    activate:
      on-profile: ares
  jpa:
    show-sql: true
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.pockit.finance: DEBUG

---
spring:
  config:
    activate:
      on-profile: hermes
  jpa:
    show-sql: false
management:
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    com.pockit.finance: INFO

---
spring:
  config:
    activate:
      on-profile: zeus
  jpa:
    show-sql: false
management:
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    com.pockit.finance: WARN
